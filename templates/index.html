{% extends "layout.html" %}

{% block title %}CCTV{% endblock %}

{% block main %}
  <div class="card p-6">
    <div class="flex items-center justify-between">
      <h2 class="text-2xl font-semibold">CCTV</h2>
    <div class="text-sm text-gray-400">Mobile-friendly • MJPEG push/poll</div>
    </div>
    <p class="mt-3 text-gray-300">Select a mode below</p>
    <div class="mode-row mt-4">
      <button id="mode-camera" class="btn px-4 py-2 rounded-md">Camera</button>
      <button id="mode-viewer" class="btn secondary px-4 py-2 rounded-md">Viewer</button>
    </div>

    <div id="camera-ui" class="mt-4 hidden">
      <h3 class="text-lg font-medium">Camera mode</h3>
      <label class="block text-sm text-gray-300 mt-2">Camera name</label>
      <input id="camera-id" class="w-full mt-1 p-2 rounded bg-slate-900 text-white" placeholder="camera-1">
      <label class="block text-sm text-gray-300 mt-3">FPS</label>
      <input id="camera-fps" type="number" value="30" min="1" max="60" class="w-24 mt-1 p-2 rounded bg-slate-900 text-white">
      <div class="mt-4">
        <div class="flex gap-3">
          <button id="start-push" class="btn secondary px-4 py-2">Start simple (MJPEG) push</button>
        </div>
      </div>
      <video id="preview" class="preview mt-4 rounded shadow-sm" autoplay playsinline muted></video>
      <div class="controls mt-3 flex items-center gap-3">
        <span id="camera-status" class="text-sm text-gray-400"></span>
      </div>
    </div>

    <div id="viewer-ui" class="mt-4 hidden">
      <h3 class="text-lg font-medium">Viewer mode</h3>
      <p class="text-sm text-gray-400 mt-1">Select a camera to watch (active cameras):</p>
      <ul id="camera-list" class="camera-list mt-3"></ul>
    </div>
  </div>

  <script>
    const STALE_THRESHOLD = {{ STALE_THRESHOLD | default(5) }};
    const cameraBtn = document.getElementById('mode-camera');
    const viewerBtn = document.getElementById('mode-viewer');
    const cameraUI = document.getElementById('camera-ui');
    const viewerUI = document.getElementById('viewer-ui');
    cameraBtn.addEventListener('click', ()=>{ cameraUI.style.display='block'; viewerUI.style.display='none'; });
    viewerBtn.addEventListener('click', async ()=>{ viewerUI.style.display='block'; cameraUI.style.display='none'; fetchCameras(); });

    // Camera capture & push
    let stream, intervalHandle;

  // Simple MJPEG push publisher
    let pushInterval = null;
    document.getElementById('start-push').addEventListener('click', async ()=>{
      const camId = document.getElementById('camera-id').value || ('cam-' + Math.random().toString(36).slice(2,7));
      const fps = Math.max(1, Math.min(30, parseInt(document.getElementById('camera-fps').value || '15')));
      try{
        const s = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        stream = s;
        const preview = document.getElementById('preview');
        preview.srcObject = stream;
        // wait for the video element to be ready and playing before capturing frames
        await new Promise((resolve, reject) => {
          const onCanPlay = () => { preview.removeEventListener('canplay', onCanPlay); resolve(); };
          const onError = (ev) => { preview.removeEventListener('error', onError); reject(new Error('Video element error')); };
          preview.addEventListener('canplay', onCanPlay);
          preview.addEventListener('error', onError);
          // try to play (some browsers require an explicit play to start rendering)
          preview.play().catch(()=>{});
          // timeout if video doesn't become ready
          setTimeout(()=>{ preview.removeEventListener('canplay', onCanPlay); reject(new Error('Timed out waiting for video feed')); }, 3000);
        });

        document.getElementById('camera-status').innerText = 'Pushing frames as ' + camId + ' (' + fps + 'fps)';

        // create a hidden canvas to draw frames
        const videoTrack = stream.getVideoTracks()[0];
        const settings = videoTrack.getSettings ? videoTrack.getSettings() : {};
        const w = settings.width || preview.videoWidth || 640;
        const h = settings.height || preview.videoHeight || 480;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        async function pushFrame(){
          try{
            // draw the currently rendered video frame
            ctx.drawImage(preview, 0, 0, canvas.width, canvas.height);
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.7));
            if(!blob) return;
            // POST as raw JPEG body with header X-Cam-ID so server stores it
            fetch('/CCTV/push_frame', {
              method: 'POST',
              headers: {
                'X-Cam-ID': camId
              },
              body: blob,
            }).catch(e=> console.warn('push_frame failed', e));
          }catch(e){ console.error('pushFrame error', e); }
        }

        // start interval
        pushInterval = setInterval(pushFrame, 1000 / fps);
        // also push one immediately
        pushFrame();

        // stop on unload
        window.addEventListener('beforeunload', ()=>{ if(pushInterval) clearInterval(pushInterval); if(stream){ stream.getTracks().forEach(t=>t.stop()); } });
      }catch(e){
        console.error('start-push failed', e);
        // better diagnostics for common errors
        let msg = e && e.message ? e.message : String(e);
        if(e && e.name === 'NotAllowedError') msg = 'Permission denied to use camera. Please allow access.';
        if(e && e.name === 'NotFoundError') msg = 'No camera found on this device.';
        if(e && e.name === 'NotReadableError') msg = 'Could not start video source (in use by another app).';
        if(e && e.name === 'OverconstrainedError') msg = 'Requested camera constraints not satisfied.';
        document.getElementById('camera-status').innerText = 'Failed to start push: ' + msg;
      }
    });

    async function fetchCameras(){
      const ul = document.getElementById('camera-list');
      ul.innerHTML = 'Loading...';
      try{
        const res = await fetch('/CCTV/feed_status');
        const json = await res.json();
        ul.innerHTML = '';
        // json.feeds is an array of {camera, age, has_frame}
        (json.feeds || []).forEach(info => {
          const id = info.camera;
          const li = document.createElement('li');
          const left = document.createElement('div');
          left.style.display = 'flex';
          left.style.alignItems = 'center';
          const a = document.createElement('a');
          a.href = '/CCTV/stream?camera=' + encodeURIComponent(id);
          a.innerText = id;
          left.appendChild(a);

          const right = document.createElement('div');
          right.style.display = 'flex';
          right.style.alignItems = 'center';
          if(info.age < STALE_THRESHOLD){
            const b = document.createElement('span');
            b.className = 'live-badge';
            b.innerText = 'LIVE';
            right.appendChild(b);
          } else {
            const stale = document.createElement('span');
            stale.className = 'status';
            stale.innerText = 'stale';
            right.appendChild(stale);
          }

          li.appendChild(left);
          li.appendChild(right);
          ul.appendChild(li);
        });
      }catch(e){ ul.innerHTML = 'Error loading camera list'; }
    }
  </script>

{% endblock %}
