<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV WebRTC System</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 1rem 2rem; }
        .navbar h1 { font-size: 1.8rem; }
        .container { max-width: 1400px; margin: 2rem auto; padding: 0 1rem; }
        .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .tab-btn { padding: 0.75rem 1.5rem; background: #2a2a2a; border: none; color: #aaa; cursor: pointer; border-radius: 8px; font-weight: 600; transition: all 0.3s; }
        .tab-btn.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .broadcast-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        @media (max-width: 1024px) { .broadcast-grid { grid-template-columns: 1fr; } }
        
        .preview-box { background: #1a1a1a; border: 2px solid #333; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
        #localVideo { width: 100%; height: 100%; object-fit: cover; }
        
        .control-panel { background: #1a1a1a; border: 2px solid #333; border-radius: 12px; padding: 2rem; }
        .control-group { margin-bottom: 1.5rem; }
        .control-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #ccc; }
        .control-group input, .control-group select { width: 100%; padding: 0.75rem; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 1rem; }
        .btn { width: 100%; padding: 0.75rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4); }
        .status { padding: 1rem; background: #2a2a2a; border-radius: 6px; margin-top: 1rem; text-align: center; }
        .status.info { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
        .status.error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        
        .cameras-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .camera-card { background: #1a1a1a; border: 2px solid #333; border-radius: 12px; padding: 1.5rem; cursor: pointer; transition: all 0.3s; text-decoration: none; color: #fff; display: block; }
        .camera-card:hover { border-color: #667eea; transform: translateY(-4px); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2); }
        .camera-card .name { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
        .camera-card .status { background: transparent; padding: 0; margin-top: 0.5rem; text-align: left; }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; background: rgba(34, 197, 94, 0.2); color: #86efac; }
        
        .no-cameras { text-align: center; padding: 4rem 2rem; color: #999; grid-column: 1/-1; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1> CCTV WebRTC System</h1>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(0)"> Broadcast</button>
            <button class="tab-btn" onclick="switchTab(1)"> Watch</button>
        </div>

        <!-- Broadcast Tab -->
        <div id="tab0" class="tab-content active">
            <div class="broadcast-grid">
                <div>
                    <h2 style="margin-bottom: 1rem;">Camera Preview</h2>
                    <div class="preview-box">
                        <video id="localVideo" autoplay playsinline muted></video>
                    </div>
                </div>
                <div>
                    <h2 style="margin-bottom: 1rem;">Broadcast Settings</h2>
                    <div class="control-panel">
                        <div class="control-group">
                            <label>Camera Name</label>
                            <input type="text" id="cameraName" placeholder="e.g., Living Room" value="cam-01">
                        </div>
                        <div class="control-group">
                            <label>Video Resolution</label>
                            <select id="resolution">
                                <option value="320x240">Low (320x240)</option>
                                <option value="640x480" selected>Medium (640x480) - Recommended</option>
                                <option value="1280x720">High (720p)</option>
                                <option value="1920x1080">Very High (1080p)</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label>Audio</label>
                            <select id="audioEnable">
                                <option value="false">No Audio</option>
                                <option value="true" selected>With Audio</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" id="startBtn" onclick="startBroadcast()">Start Broadcasting</button>
                        <div id="bcStatus" class="status info" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Watch Tab -->
        <div id="tab1" class="tab-content">
            <h2 style="margin-bottom: 2rem;">Available Cameras</h2>
            <div id="camerasList" class="cameras-grid">
                <div class="no-cameras">Loading cameras...</div>
            </div>
            <!-- Remote Video Player (hidden by default) -->
            <div id="videoPlayerModal" style="display: none; margin-top: 3rem;">
                <div id="watchStatus" style="padding: 1rem; background: rgba(59, 130, 246, 0.2); color: #93c5fd; border-radius: 6px; margin-bottom: 1rem; text-align: center;">
                    Connecting...
                </div>
                <div style="background: #1a1a1a; border: 2px solid #333; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; margin-bottom: 1.5rem;">
                    <video id="remoteVideo" autoplay playsinline controls style="width: 100%; height: 100%; object-fit: cover;"></video>
                </div>
                <button class="btn btn-primary" onclick="closeRemoteVideo()" style="width: auto; padding: 0.75rem 2rem;">Close Video</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io(window.location.origin, {
            path: '/CCTV/socket.io'
        });
        let localStream = null;
        let broadcasting = false;
        let peerConnections = {};

        function switchTab(n) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab' + n).classList.add('active');
            document.querySelectorAll('.tab-btn')[n].classList.add('active');
        }

        socket.on('broadcasters_list', (data) => {
            updateCamerasList(data.broadcasters || []);
        });

        async function startBroadcast() {
            if (broadcasting) return;
            broadcasting = true;

            const cameraName = document.getElementById('cameraName').value || 'cam-' + Date.now();
            const [width, height] = document.getElementById('resolution').value.split('x').map(Number);
            const audio = document.getElementById('audioEnable').value === 'true';
            const status = document.getElementById('bcStatus');
            const btn = document.getElementById('startBtn');

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: width }, height: { ideal: height } },
                    audio: audio
                });

                const video = document.getElementById('localVideo');
                video.srcObject = localStream;

                socket.emit('register_broadcaster', {
                    camera_id: cameraName,
                    name: cameraName
                });

                status.textContent = ` Broadcasting "${cameraName}" - Ready to accept viewers`;
                status.style.display = 'block';
                btn.textContent = 'Stop Broadcasting';
                btn.onclick = stopBroadcast;

                setInterval(() => {
                    socket.emit('broadcaster_heartbeat', { camera_id: cameraName });
                }, 5000);

            } catch (e) {
                status.textContent = ` Error: ${e.message}`;
                status.classList.remove('info');
                status.classList.add('error');
                status.style.display = 'block';
                broadcasting = false;
            }
        }

        function stopBroadcast() {
            broadcasting = false;
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
            }
            document.getElementById('startBtn').textContent = 'Start Broadcasting';
            document.getElementById('startBtn').onclick = startBroadcast;
            document.getElementById('bcStatus').style.display = 'none';
            socket.emit('disconnect');
        }

        socket.on('viewer_offer', async (data) => {
            const { viewer_sid, sdp } = data;
            console.log(`[Broadcast] Received viewer_offer from ${viewer_sid}`);
            const peerConnection = createPeerConnection(viewer_sid, true);

            localStream.getTracks().forEach(track => {
                console.log(`[Broadcast] Adding track: ${track.kind}`);
                peerConnection.addTrack(track, localStream);
            });

            await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp }));
            console.log('[Broadcast] Remote offer set');
            
            const answer = await peerConnection.createAnswer();
            
            // Modify SDP to prefer VP8 codec (better compatibility)
            answer.sdp = preferCodec(answer.sdp, 'video', 'VP8');
            answer.sdp = preferCodec(answer.sdp, 'audio', 'opus');
            
            // Lower bitrate for better performance through TURN
            answer.sdp = setBitrate(answer.sdp, 'video', 500); // 500 kbps max
            answer.sdp = setBitrate(answer.sdp, 'audio', 32);  // 32 kbps max
            
            await peerConnection.setLocalDescription(answer);
            console.log('[Broadcast] Sending answer');

            socket.emit('broadcaster_answer', {
                viewer_sid: viewer_sid,
                sdp: answer.sdp
            });
        });

        socket.on('ice_candidate', (data) => {
            const { from_sid, candidate } = data;
            console.log(`[Ice] Received ICE candidate from ${from_sid}`);
            
            // Check if this is for our current watch peer connection
            if (currentWatchPeer && currentWatchCameraId) {
                // We're a viewer - add the ICE candidate to our watch peer
                console.log(`[Watch] Adding ICE candidate from broadcaster`);
                currentWatchPeer.addIceCandidate(new RTCIceCandidate(candidate))
                    .catch(e => console.error('[Watch] ICE error:', e));
            }
            
            // Check if this is for a broadcaster's peer connection with a viewer
            const pc = peerConnections[from_sid];
            if (pc) {
                console.log(`[Broadcast] Adding ICE candidate from viewer ${from_sid}`);
                pc.addIceCandidate(new RTCIceCandidate(candidate))
                    .catch(e => console.warn('[Broadcast] ICE error:', e));
            }
        });

        function createPeerConnection(peerId, isBroadcaster) {
            const peerConnection = new RTCPeerConnection({
                iceServers: [
                    // YOUR OWN TURN SERVER
                    {
                        urls: 'turn:122.170.238.244:3478',
                        username: 'cctv',
                        credential: 'wheresrusty'
                    },
                    {
                        urls: 'turn:122.170.238.244:3478?transport=tcp',
                        username: 'cctv',
                        credential: 'wheresrusty'
                    }
                ],
                iceTransportPolicy: 'all',  // Try all options: direct, STUN, and TURN
                iceCandidatePoolSize: 10    // Gather more ICE candidates
            });

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    console.log(`[PC-${peerId}] Sending ICE candidate: ${event.candidate.type}`);
                    socket.emit('ice_candidate', {
                        target_sid: peerId,
                        camera_id: peerId,
                        candidate: event.candidate
                    });
                } else {
                    console.log(`[PC-${peerId}] ICE gathering complete`);
                }
            };

            peerConnection.onconnectionstatechange = () => {
                console.log(`[PC-${peerId}] Connection state: ${peerConnection.connectionState}`);
                const statusEl = document.getElementById('watchStatus');
                if (statusEl && !isBroadcaster) {
                    switch(peerConnection.connectionState) {
                        case 'connecting':
                            statusEl.textContent = '🔄 Connecting...';
                            statusEl.style.background = 'rgba(59, 130, 246, 0.2)';
                            break;
                        case 'connected':
                            statusEl.textContent = '✅ Connected - Receiving video';
                            statusEl.style.background = 'rgba(34, 197, 94, 0.2)';
                            statusEl.style.color = '#86efac';
                            break;
                        case 'disconnected':
                            statusEl.textContent = '⚠️ Disconnected';
                            statusEl.style.background = 'rgba(251, 191, 36, 0.2)';
                            statusEl.style.color = '#fcd34d';
                            break;
                        case 'failed':
                            statusEl.textContent = '❌ Connection failed';
                            statusEl.style.background = 'rgba(239, 68, 68, 0.2)';
                            statusEl.style.color = '#fca5a5';
                            break;
                    }
                }
            };

            peerConnection.oniceconnectionstatechange = () => {
                const state = peerConnection.iceConnectionState;
                console.log(`[PC-${peerId}] ICE state: ${state}`);
                
                // If connection fails, log detailed info
                if (state === 'failed' || state === 'disconnected') {
                    console.error(`[PC-${peerId}] ICE connection ${state}. This usually means NAT/firewall issue.`);
                    
                    // Try ICE restart
                    if (state === 'failed' && !isBroadcaster && peerId === currentWatchCameraId) {
                        console.log('[Watch] Attempting ICE restart...');
                        // ICE restart will be handled by creating a new offer with iceRestart flag
                    }
                }
            };

            peerConnection.onsignalingstatechange = () => {
                console.log(`[PC-${peerId}] Signaling state: ${peerConnection.signalingState}`);
            };

            if (isBroadcaster) {
                peerConnection.ontrack = (event) => {
                    console.log(`[Broadcast] Received track: ${event.track.kind} (should not happen for broadcaster)`);
                };
            }

            peerConnections[peerId] = peerConnection;
            return peerConnection;
        }

        function updateCamerasList(cameras) {
            const list = document.getElementById('camerasList');
            if (!cameras || cameras.length === 0) {
                list.innerHTML = '<div class="no-cameras"><p> No cameras broadcasting</p><p style="font-size: 0.9rem; color: #666; margin-top: 0.5rem;">Start broadcasting from the Broadcast tab</p></div>';
                return;
            }

            list.innerHTML = cameras.map(cid => `
                <a href="#" class="camera-card" onclick="watchCamera('${cid}'); return false;">
                    <div class="name">${cid}</div>
                    <div class="status"><span class="badge"> Live</span></div>
                </a>
            `).join('');
        }

        let remoteStream = null;
        let currentWatchPeer = null;
        let currentWatchCameraId = null;

        async function watchCamera(cameraId) {
            try {
                // Show video player
                document.getElementById('videoPlayerModal').style.display = 'block';
                
                // Close previous connection if exists
                if (currentWatchPeer) {
                    currentWatchPeer.close();
                    delete peerConnections[currentWatchCameraId];
                }

                const pc = createPeerConnection(cameraId, false);
                currentWatchPeer = pc;
                currentWatchCameraId = cameraId;

                pc.ontrack = (event) => {
                    console.log(`[Watch] ontrack event received, streams: ${event.streams.length}`);
                    remoteStream = event.streams[0];
                    const video = document.getElementById('remoteVideo');
                    video.srcObject = remoteStream;
                    video.play().catch(e => {
                        console.error('[Watch] Video play error:', e);
                        // Try to play on user interaction
                        video.muted = true;
                        video.play().catch(err => console.error('[Watch] Muted play failed:', err));
                    });
                    console.log(`[Watch] Playing video from ${cameraId}`);
                };

                // Force codec compatibility
                pc.addTransceiver('video', { 
                    direction: 'recvonly'
                });
                pc.addTransceiver('audio', { 
                    direction: 'recvonly'
                });

                const offer = await pc.createOffer();
                
                // Modify SDP to prefer VP8 codec (better compatibility across devices)
                offer.sdp = preferCodec(offer.sdp, 'video', 'VP8');
                offer.sdp = preferCodec(offer.sdp, 'audio', 'opus');
                
                await pc.setLocalDescription(offer);

                console.log(`[Watch] Sending offer for camera ${cameraId}`);
                socket.emit('viewer_offer', {
                    camera_id: cameraId,
                    sdp: offer.sdp
                });
            } catch (e) {
                console.error('[Watch] Error:', e);
                alert('Failed to connect to camera: ' + e.message);
            }
        }

        function closeRemoteVideo() {
            document.getElementById('videoPlayerModal').style.display = 'none';
            if (currentWatchPeer) {
                currentWatchPeer.close();
                currentWatchPeer = null;
            }
            currentWatchCameraId = null;
            if (remoteStream) {
                remoteStream.getTracks().forEach(track => track.stop());
                remoteStream = null;
            }
        }

        socket.on('broadcaster_answer', async (data) => {
            const { sdp } = data;
            console.log('[Watch] Received broadcaster_answer');
            if (currentWatchPeer && currentWatchPeer.signalingState === 'have-local-offer') {
                try {
                    await currentWatchPeer.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp }));
                    console.log('[Watch] Answer set successfully');
                } catch (e) {
                    console.error('[Watch] Error setting answer:', e);
                }
            } else {
                console.warn('[Watch] No peer connection waiting for answer, or bad state');
            }
        });

        // Helper function to prefer specific codec in SDP
        function preferCodec(sdp, kind, codec) {
            const lines = sdp.split('\r\n');
            const mLineIndex = lines.findIndex(line => line.startsWith(`m=${kind}`));
            if (mLineIndex === -1) return sdp;

            const codecLines = [];
            const otherLines = [];
            
            for (let i = mLineIndex + 1; i < lines.length; i++) {
                const line = lines[i];
                if (line.startsWith('m=')) break;
                
                if (line.includes(`rtpmap:`) && line.toLowerCase().includes(codec.toLowerCase())) {
                    const payloadType = line.match(/rtpmap:(\d+)/)?.[1];
                    if (payloadType) {
                        codecLines.push(payloadType);
                    }
                }
            }

            if (codecLines.length === 0) return sdp;

            // Reorder payload types in m= line
            const mLine = lines[mLineIndex];
            const parts = mLine.split(' ');
            const mediaPayloads = parts.slice(3);
            
            // Put preferred codec first
            const reordered = [...codecLines, ...mediaPayloads.filter(p => !codecLines.includes(p))];
            parts.splice(3, mediaPayloads.length, ...reordered);
            lines[mLineIndex] = parts.join(' ');

            return lines.join('\r\n');
        }

        // Helper function to set bandwidth limit in SDP
        function setBitrate(sdp, kind, bitrate) {
            const lines = sdp.split('\r\n');
            const mLineIndex = lines.findIndex(line => line.startsWith(`m=${kind}`));
            if (mLineIndex === -1) return sdp;

            // Find or create b=AS line
            let bLineIndex = -1;
            for (let i = mLineIndex + 1; i < lines.length; i++) {
                if (lines[i].startsWith('m=')) break;
                if (lines[i].startsWith('b=AS:')) {
                    bLineIndex = i;
                    break;
                }
            }

            const bLine = `b=AS:${bitrate}`;
            if (bLineIndex !== -1) {
                lines[bLineIndex] = bLine;
            } else {
                lines.splice(mLineIndex + 1, 0, bLine);
            }

            return lines.join('\r\n');
        }
    </script>
</body>
</html>
