{% extends "layout.html" %}

{% block title %}CCTV{% endblock %}

{% block main %}
  <div class="card p-6">
    <div class="flex items-center justify-between">
      <h2 class="text-2xl font-semibold">CCTV</h2>
      <div class="text-sm text-gray-400">Mobile-friendly • WebRTC</div>
    </div>
    <p class="mt-3 text-gray-300">Select a mode below</p>
    <div class="mode-row mt-4">
      <button id="mode-camera" class="btn px-4 py-2 rounded-md">Camera</button>
      <button id="mode-viewer" class="btn secondary px-4 py-2 rounded-md">Viewer</button>
    </div>

    <div id="camera-ui" class="mt-4 hidden">
      <h3 class="text-lg font-medium">Camera mode</h3>
      <label class="block text-sm text-gray-300 mt-2">Camera name</label>
      <input id="camera-id" class="w-full mt-1 p-2 rounded bg-slate-900 text-white" placeholder="camera-1">
      <label class="block text-sm text-gray-300 mt-3">FPS</label>
      <input id="camera-fps" type="number" value="30" min="1" max="60" class="w-24 mt-1 p-2 rounded bg-slate-900 text-white">
      <div class="mt-4">
        <button id="start-camera" class="btn px-4 py-2">Start streaming</button>
      </div>
      <video id="preview" class="preview mt-4 rounded shadow-sm" autoplay playsinline muted></video>
      <div class="controls mt-3 flex items-center gap-3">
        <button id="toggle-mic" class="btn secondary">Mic Off</button>
        <span id="camera-status" class="text-sm text-gray-400"></span>
      </div>
    </div>

    <div id="viewer-ui" class="mt-4 hidden">
      <h3 class="text-lg font-medium">Viewer mode</h3>
      <p class="text-sm text-gray-400 mt-1">Select a camera to watch (active cameras):</p>
      <ul id="camera-list" class="camera-list mt-3"></ul>
    </div>
  </div>

  <script>
    const cameraBtn = document.getElementById('mode-camera');
    const viewerBtn = document.getElementById('mode-viewer');
    const cameraUI = document.getElementById('camera-ui');
    const viewerUI = document.getElementById('viewer-ui');
    cameraBtn.addEventListener('click', ()=>{ cameraUI.style.display='block'; viewerUI.style.display='none'; });
    viewerBtn.addEventListener('click', ()=>{ viewerUI.style.display='block'; cameraUI.style.display='none'; fetchCameras(); });

    // Camera capture & push
    let stream, intervalHandle;
    document.getElementById('start-camera').addEventListener('click', async ()=>{
    const camId = document.getElementById('camera-id').value || ('cam-' + Math.random().toString(36).slice(2,7));
        const preview = document.getElementById('preview');
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        preview.srcObject = stream;
  document.getElementById('camera-status').innerText = 'Ready — streaming as ' + camId;

        // connect to Socket.IO signalling
        const socket = io();
        socket.on('connect', () => {
          console.log('publisher socket connected', socket.id);
          // register publisher only after socket has connected
          socket.emit('register-publisher', { camera_id: camId });
          // send periodic heartbeat so the server knows this publisher is alive
          heartbeatInterval = setInterval(() => {
            socket.emit('publisher-heartbeat', { camera_id: camId });
          }, 2000);
        });
        socket.on('error', (e) => { console.error('socket error (publisher):', e); });
        let heartbeatInterval = null;

  const pcs = {}; // viewer_sid -> RTCPeerConnection

        socket.on('viewer-offer', async (data) => {
          const viewer_sid = data.viewer_sid;
          const sdp = data.sdp;
          console.log('viewer-offer from', viewer_sid);
          const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
          pcs[viewer_sid] = pc;

          // add local tracks
          stream.getTracks().forEach((t) => pc.addTrack(t, stream));

          pc.onicecandidate = (e) => {
            if (e.candidate) {
              socket.emit('ice-candidate', { to: viewer_sid, candidate: e.candidate });
            }
          };

          try {
            await pc.setRemoteDescription({ type: 'offer', sdp: sdp });
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
              socket.emit('publisher-answer', { viewer_sid: viewer_sid, sdp: pc.localDescription.sdp });
              console.log('sent publisher-answer to viewer', viewer_sid);
          } catch (e) {
            console.error('failed to handle viewer-offer', e);
          }
        });

        socket.on('ice-candidate', (data) => {
          const from = data.from;
          const candidate = data.candidate;
          const pc = pcs[from];
          if (pc) pc.addIceCandidate(candidate).catch(e => console.error('addIce failed', e));
        });
        socket.on('disconnect', () => { console.log('publisher socket disconnected'); });
        // toggle mic button (update label & track.enabled reliably)
        document.getElementById('toggle-mic').addEventListener('click', ()=>{
          if(!stream) return;
          const audioTracks = stream.getAudioTracks();
          if(!audioTracks.length) return;
          const enabled = !audioTracks[0].enabled;
          audioTracks.forEach(t => t.enabled = enabled);
          document.getElementById('toggle-mic').innerText = enabled ? 'Mic On' : 'Mic Off';
        });
    // clear heartbeat when page unloads
    window.addEventListener('beforeunload', () => { if (heartbeatInterval) clearInterval(heartbeatInterval); });
    });

    async function fetchCameras(){
      const ul = document.getElementById('camera-list');
      ul.innerHTML = 'Loading...';
      try{
        const res = await fetch('/CCTV/feed_status');
        const json = await res.json();
        ul.innerHTML = '';
        for(const id in json){
          const li = document.createElement('li');
          const left = document.createElement('div');
          left.style.display = 'flex';
          left.style.alignItems = 'center';
          const a = document.createElement('a');
          a.href = '/CCTV/stream?camera=' + encodeURIComponent(id);
          a.innerText = id;
          left.appendChild(a);

          const right = document.createElement('div');
          right.style.display = 'flex';
          right.style.alignItems = 'center';
          if(json[id].alive){
            const b = document.createElement('span');
            b.className = 'live-badge';
            b.innerText = 'LIVE';
            right.appendChild(b);
          } else {
            const stale = document.createElement('span');
            stale.className = 'status';
            stale.innerText = 'stale';
            right.appendChild(stale);
          }

          li.appendChild(left);
          li.appendChild(right);
          ul.appendChild(li);
        }
      }catch(e){ ul.innerHTML = 'Error loading camera list'; }
    }
  </script>

{% endblock %}
