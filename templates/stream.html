{% extends "layout.html" %}

{% block title %}Live Stream{% endblock %}

{% block main %}
  <h2>Live Stream{% if request.args.get('camera') %} - {{ request.args.get('camera') }}{% endif %}</h2>
  <div class="stream-wrapper card p-4" data-camera="{{ request.args.get('camera') or '' }}">
    <img id="mjpeg" alt="Stream" class="rounded shadow-sm bg-black" style="width:100%; display:block;">
    <div class="controls mt-3 flex items-center gap-3">
      <span id="feed-status-msg" class="text-sm text-red-400"></span>
    </div>
  </div>
  <p>
    <a class="btn" href="{{ url_for('index') }}">Back</a>
  </p>
  <script>
  // Simple MJPEG viewer: show /CCTV/video_feed?camera=... and poll feed_status
  (function(){
    const camera = document.querySelector('.stream-wrapper').dataset.camera || '';
    const img = document.getElementById('mjpeg');
    const msg = document.getElementById('feed-status-msg');

    function setOffline(reason){ msg.innerText = reason || 'No feed available for this camera.'; img.style.display = 'none'; }
    function setOnline(){ msg.innerText = ''; img.style.display = 'block'; }

    function startMJPEG(){
      img.src = '/CCTV/video_feed?camera=' + encodeURIComponent(camera) + '&_t=' + Date.now();
      img.onerror = ()=>{ setOffline('MJPEG stream not available'); };
    }

    async function check(){
      try{
        const res = await fetch('/CCTV/feed_status');
        if(!res.ok){ setOffline('Could not check feed status'); return; }
        const json = await res.json();
        if(!camera){ setOffline('No camera id specified'); return; }
        const info = (json.feeds || []).find(f => f.camera === camera);
        if(!info){ setOffline('Feed is not live'); }
        else { setOnline(); startMJPEG(); }
      }catch(e){ setOffline('Error checking feed status'); }
    }

    check();
    setInterval(check, 3000);
  })();
  </script>
{% endblock %}
